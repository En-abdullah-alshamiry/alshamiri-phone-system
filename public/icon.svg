<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="phone-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Subtle glow inner ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Smartphone Body with shadow -->
  <g filter="url(#shadow)">
    <rect x="136" y="76" width="240" height="360" rx="40" fill="#1e293b" stroke="url(#phone-glow)" stroke-width="6"/>
    <!-- Screen -->
    <rect x="152" y="104" width="208" height="304" rx="28" fill="#090d16"/>
    
    <!-- Top speaker grill & camera notch -->
    <rect x="226" y="88" width="60" height="6" rx="3" fill="#475569"/>
    <circle cx="206" cy="91" r="3.5" fill="#38bdf8"/>

    <!-- Screen graphic: modern tech dashboard -->
    <!-- Signal & Battery -->
    <circle cx="172" cy="122" r="3" fill="#10b981"/>
    <rect x="318" y="118" width="24" height="10" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="320" y="120" width="16" height="6" rx="1.5" fill="#10b981"/>

    <!-- Central Logo Icon: Wrench + Phone + Signal -->
    <circle cx="256" cy="220" r="54" fill="url(#phone-glow)" fill-opacity="0.15" stroke="url(#phone-glow)" stroke-width="2.5"/>
    
    <!-- Repair Wrench & Bolt -->
    <path d="M276 190 C282 196, 284 206, 280 214 L244 250 C240 254, 234 254, 230 250 L226 246 C222 242, 222 236, 226 232 L262 196 C270 192, 280 194, 276 190 Z" fill="#38bdf8"/>
    <path d="M236 240 L212 264 C208 268, 202 268, 198 264 L194 260 C190 256, 190 250, 194 246 L218 222" stroke="url(#accent-grad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Chip pins & connectivity -->
    <line x1="200" y1="300" x2="312" y2="300" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="320" x2="280" y2="320" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="340" x2="260" y2="340" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Currency Symbol YER / SAR / USD indicator -->
    <rect x="274" y="324" width="46" height="24" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <text x="297" y="340" font-family="sans-serif" font-weight="900" font-size="12" fill="#34d399" text-anchor="middle">YER</text>

    <!-- Bottom home bar -->
    <rect x="216" y="394" width="80" height="4" rx="2" fill="#64748b"/>
  </g>
</svg>
